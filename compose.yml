name: aws-playground-fastapi
services:
  # ----------------------------------------------------------------------------
  # 1. Database & Management
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-service
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Caching & In-Memory Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-ui
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. Local Email Sandbox (Mailpit)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-service
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Mock AWS Cloud Services (LocalStack S3) & S3 Browser UI
  # ----------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3.8.0
    container_name: localstack-service
    restart: always
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=s3,sqs,sns,dynamodb,secretsmanager,ssm,lambda,events,kinesis
      - DISABLE_CORS_CHECKS=1
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  s3-browser:
    image: stephenjr002/sairo:latest
    container_name: s3-browser-ui
    restart: always
    ports:
      - "${S3_BROWSER_PORT:-8085}:8000"
    environment:
      - S3_ENDPOINT=http://localstack:4566
      - S3_PUBLIC_ENDPOINT=http://localhost:${LOCALSTACK_PORT:-4566}
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - SECURE_COOKIE=false
      - ADMIN_USER=${S3_BROWSER_USER:-admin}
      - ADMIN_PASS=${S3_BROWSER_PASS:-admin}
      - JWT_SECRET=${JWT_SECRET:-sairo-secret-key-fixed-32-chars-long}
      - TELEMETRY=false
    volumes:
      - s3_browser_data:/data
      - ./docker/s3-browser/sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    depends_on:
      - localstack
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M


  # ----------------------------------------------------------------------------
  # 5. Observability (Prometheus & Grafana)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-service
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-service
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. Core FastAPI Application
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: api-service
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-appdb}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - AWS_ENDPOINT_URL=http://localstack:4566
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. Reverse Proxy Gateway (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/portal:/usr/share/nginx/html:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  # ----------------------------------------------------------------------------
  # 8. Testing & Load Generation (Locust, Pytest, Alembic)
  # ----------------------------------------------------------------------------
  locust:
    image: locustio/locust
    container_name: locust-service
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    volumes:
      - ./docker/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://api:8000
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: test-runner
    command: pytest -v app/tests/
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - test
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: migration-runner
    command: alembic upgrade head
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-appdb}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  s3_browser_data: