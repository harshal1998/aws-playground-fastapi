name: CI

on:
  # Any base branch, so stacked PRs get checked too.
  pull_request:
  push:
    branches: [develop]

# A new push to a PR cancels its in-flight run. Develop pushes get one group
# per commit so they never queue or cancel: cd.yml publishes only after a
# successful develop run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Runtime deps too: the unit tests import the app's services.
      - name: Install app deps and dev tooling
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      # Service-level tests on fakeredis + moto: no Docker, network or
      # running stack, so they report in seconds. The compose `test` service
      # in the integration-test job also picks them up (it runs app/tests/).
      - name: Run unit tests
        run: pytest app/tests/unit -q -p no:cacheprovider

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Keeps the default GHA cache scope, which cd.yml also reads when it
      # builds the same runtime target for GHCR.
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: aws-playground-fastapi-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test image = runtime deps + requirements-dev.txt, used by the compose
      # `test` service. Its own cache scope stops the two builds overwriting
      # each other's cache; it also reads the api scope for the shared base.
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: aws-playground-fastapi-test:latest
          load: true
          cache-from: |
            type=gha
            type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Start backing services and API
        run: docker compose up -d --wait db redis localstack mailpit api

      - name: Run integration test suite
        run: docker compose run --rm test

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
