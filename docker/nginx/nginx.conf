events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Docker's embedded DNS. Resolving at request time (via a variable in
    # proxy_pass) means a recreated api container with a new IP keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        set $fastapi_upstream http://api:8000;

        # 1. Developer Portal Dashboard at root /
        location / {
            root /usr/share/nginx/html;
            index index.html;
            ssi on;
            try_files $uri $uri/ /index.html;
        }

        # 2. FastAPI Reverse Proxy routing
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            # Matches the API's S3_MAX_UPLOAD_BYTES default (10 MiB); nginx's
            # 1 MB default rejected larger portal uploads with 413.
            client_max_body_size 10m;
            proxy_pass $fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass $fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass $fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
